services:
  coding-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    command: python -m zeroi.services.coding_agent
    depends_on:
      - redis
      - postgres
    networks:
      - zeroi

  research-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    command: python -m zeroi.services.research_agent
    depends_on:
      - redis
      - postgres
    networks:
      - zeroi
