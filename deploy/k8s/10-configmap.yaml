apiVersion: v1
kind: ConfigMap
metadata:
  name: zeroi-config
  namespace: zeroi
data:
  ZEROI_ENV: "prod"
  LOG_LEVEL: "INFO"
  REDIS_URL: "redis://redis:6379/0"
  DATABASE_URL: "postgresql+asyncpg://zeroi:zeroi@postgres:5432/zeroi"
  ARTIFACT_BACKEND: "s3"
  S3_ENDPOINT: "http://minio:9000"
  S3_BUCKET: "zeroi-artifacts"
  QWEN_UI_AGENT_URL: "http://qwen-ui-agent:8010"
  AUTH_DISABLED: "false"
