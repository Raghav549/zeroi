apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness
  namespace: zeroi
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness
  template:
    metadata:
      labels:
        app: harness
    spec:
      containers:
        - name: harness
          image: zeroi:latest
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - zeroi.services.harness
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: zeroi-config
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: harness
  namespace: zeroi
spec:
  selector:
    app: harness
  ports:
    - port: 80
      targetPort: 8000
